<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1420" height="1040" viewBox="0 0 1420 1040" role="img" aria-labelledby="title desc">
  <title id="title">Recurrent-depth transformer with modulo KV-cache sharing</title>
  <desc id="desc">Six token columns pass through a prelude, ten uses of a shared recurrent block with five KV-cache slots, and a coda. Blue arrows show attention to the prior token. A red sawtooth path shows opaque serial computation flowing down through recurrent steps and then back to a shallow step of the next token.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="recurrentFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626" stroke="#fff" stroke-width="1.5" paint-order="stroke fill"/>
    </marker>

    <g id="pipeline-column">
      <rect x="0" y="130" width="130" height="44" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="65" y="157" text-anchor="middle" class="box-label">Prelude</text>

      <rect x="0" y="215" width="130" height="44" rx="7" fill="url(#recurrentFill)" stroke="#7c3aed" stroke-width="1.4"/>
      <text x="65" y="242" text-anchor="middle" class="box-label">R1 | KV1</text>
      <rect x="0" y="270" width="130" height="44" rx="7" fill="url(#recurrentFill)" stroke="#7c3aed" stroke-width="1.4"/>
      <text x="65" y="297" text-anchor="middle" class="box-label">R2 | KV2</text>
      <rect x="0" y="325" width="130" height="44" rx="7" fill="url(#recurrentFill)" stroke="#7c3aed" stroke-width="1.4"/>
      <text x="65" y="352" text-anchor="middle" class="box-label">R3 | KV3</text>
      <rect x="0" y="380" width="130" height="44" rx="7" fill="url(#recurrentFill)" stroke="#7c3aed" stroke-width="1.4"/>
      <text x="65" y="407" text-anchor="middle" class="box-label">R4 | KV4</text>
      <rect x="0" y="435" width="130" height="44" rx="7" fill="url(#recurrentFill)" stroke="#7c3aed" stroke-width="1.4"/>
      <text x="65" y="462" text-anchor="middle" class="box-label">R5 | KV5</text>

      <rect x="0" y="490" width="130" height="44" rx="7" fill="#f5d0fe" stroke="#a21caf" stroke-width="1.7"/>
      <text x="65" y="517" text-anchor="middle" class="box-label">R6 | KV1 reuse</text>
      <rect x="0" y="545" width="130" height="44" rx="7" fill="#f5d0fe" stroke="#a21caf" stroke-width="1.7"/>
      <text x="65" y="572" text-anchor="middle" class="box-label">R7 | KV2 reuse</text>
      <rect x="0" y="600" width="130" height="44" rx="7" fill="#f5d0fe" stroke="#a21caf" stroke-width="1.7"/>
      <text x="65" y="627" text-anchor="middle" class="box-label">R8 | KV3 reuse</text>
      <rect x="0" y="655" width="130" height="44" rx="7" fill="#f5d0fe" stroke="#a21caf" stroke-width="1.7"/>
      <text x="65" y="682" text-anchor="middle" class="box-label">R9 | KV4 reuse</text>
      <rect x="0" y="710" width="130" height="44" rx="7" fill="#f5d0fe" stroke="#a21caf" stroke-width="1.7"/>
      <text x="65" y="737" text-anchor="middle" class="box-label">R10 | KV5 reuse</text>

      <rect x="0" y="795" width="130" height="44" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="65" y="822" text-anchor="middle" class="box-label">Coda</text>

      <path d="M65 97 L65 130" class="flow"/>
      <path d="M65 174 L65 215" class="flow"/>
      <path d="M65 259 L65 270" class="flow"/>
      <path d="M65 314 L65 325" class="flow"/>
      <path d="M65 369 L65 380" class="flow"/>
      <path d="M65 424 L65 435" class="flow"/>
      <path d="M65 479 L65 490" class="flow"/>
      <path d="M65 534 L65 545" class="flow"/>
      <path d="M65 589 L65 600" class="flow"/>
      <path d="M65 644 L65 655" class="flow"/>
      <path d="M65 699 L65 710" class="flow"/>
      <path d="M65 754 L65 795" class="flow"/>
      <path d="M65 839 L65 872" class="flow"/>
    </g>

    <g id="attention-boundary">
      <path d="M130 152 L215 152" class="attention"/>

      <path d="M130 512 L160 512 L191 237 L215 237" class="attention"/>
      <path d="M130 567 L160 567 L191 292 L215 292" class="attention"/>
      <path d="M130 622 L160 622 L191 347 L215 347" class="attention"/>
      <path d="M130 677 L160 677 L191 402 L215 402" class="attention"/>
      <path d="M130 732 L160 732 L191 457 L215 457" class="attention"/>

      <path d="M130 512 L215 512" class="attention"/>
      <path d="M130 567 L215 567" class="attention"/>
      <path d="M130 622 L215 622" class="attention"/>
      <path d="M130 677 L215 677" class="attention"/>
      <path d="M130 732 L215 732" class="attention"/>

      <path d="M130 817 L215 817" class="attention"/>
    </g>

    <style>
      .title { font: 700 25px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .token { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .small { font: 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .box-label { font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #1e293b; }
      .section-label { font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; letter-spacing: .04em; }
      .flow { fill: none; stroke: #64748b; stroke-width: 1.4; marker-end: url(#arrow-gray); }
      .attention { fill: none; stroke: #2563eb; stroke-width: 1.5; stroke-opacity: .48; marker-end: url(#arrow-blue); }
      .red-halo { fill: none; stroke: #fff; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .serial { fill: none; stroke: #dc2626; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .serial-head { fill: #dc2626; stroke: #fff; stroke-width: 3; stroke-linejoin: round; paint-order: stroke fill; }
    </style>
  </defs>

  <rect width="1420" height="1040" fill="url(#bg)"/>
  <text x="28" y="38" class="title">Modulo recurrent KV sharing creates a cross-token latent path</text>

  <text x="28" y="99" class="section-label">INPUT TOKENS</text>
  <text x="28" y="170" class="section-label">PRELUDE</text>
  <text x="28" y="240" class="section-label">SHARED</text>
  <text x="28" y="257" class="section-label">RECURRENT</text>
  <text x="28" y="274" class="section-label">BLOCK x10</text>
  <text x="28" y="835" class="section-label">CODA</text>
  <text x="28" y="910" class="section-label">OUTPUT</text>

  <g>
    <rect x="150" y="76" width="130" height="36" rx="18" fill="#fff" stroke="#94a3b8"/>
    <text x="215" y="99" text-anchor="middle" class="token">The</text>

    <rect x="365" y="76" width="130" height="36" rx="18" fill="#fff" stroke="#94a3b8"/>
    <text x="430" y="99" text-anchor="middle" class="token">model</text>

    <rect x="580" y="76" width="130" height="36" rx="18" fill="#fff" stroke="#94a3b8"/>
    <text x="645" y="99" text-anchor="middle" class="token">reasons</text>

    <rect x="795" y="76" width="130" height="36" rx="18" fill="#fff" stroke="#94a3b8"/>
    <text x="860" y="99" text-anchor="middle" class="token">silently</text>

    <rect x="1010" y="76" width="130" height="36" rx="18" fill="#fff" stroke="#94a3b8"/>
    <text x="1075" y="99" text-anchor="middle" class="token">across</text>

    <rect x="1225" y="76" width="130" height="36" rx="18" fill="#fff" stroke="#94a3b8"/>
    <text x="1290" y="99" text-anchor="middle" class="token">tokens</text>
  </g>

  <use href="#pipeline-column" xlink:href="#pipeline-column" x="150" y="15"/>
  <use href="#pipeline-column" xlink:href="#pipeline-column" x="365" y="15"/>
  <use href="#pipeline-column" xlink:href="#pipeline-column" x="580" y="15"/>
  <use href="#pipeline-column" xlink:href="#pipeline-column" x="795" y="15"/>
  <use href="#pipeline-column" xlink:href="#pipeline-column" x="1010" y="15"/>
  <use href="#pipeline-column" xlink:href="#pipeline-column" x="1225" y="15"/>

  <use href="#attention-boundary" xlink:href="#attention-boundary" x="150" y="15"/>
  <use href="#attention-boundary" xlink:href="#attention-boundary" x="365" y="15"/>
  <use href="#attention-boundary" xlink:href="#attention-boundary" x="580" y="15"/>
  <use href="#attention-boundary" xlink:href="#attention-boundary" x="795" y="15"/>
  <use href="#attention-boundary" xlink:href="#attention-boundary" x="1010" y="15"/>

  <g>
    <rect x="150" y="887" width="130" height="36" rx="18" fill="#fff" stroke="#16a34a"/>
    <text x="215" y="910" text-anchor="middle" class="token">model</text>
    <rect x="365" y="887" width="130" height="36" rx="18" fill="#fff" stroke="#16a34a"/>
    <text x="430" y="910" text-anchor="middle" class="token">reasons</text>
    <rect x="580" y="887" width="130" height="36" rx="18" fill="#fff" stroke="#16a34a"/>
    <text x="645" y="910" text-anchor="middle" class="token">silently</text>
    <rect x="795" y="887" width="130" height="36" rx="18" fill="#fff" stroke="#16a34a"/>
    <text x="860" y="910" text-anchor="middle" class="token">across</text>
    <rect x="1010" y="887" width="130" height="36" rx="18" fill="#fff" stroke="#16a34a"/>
    <text x="1075" y="910" text-anchor="middle" class="token">tokens</text>
    <rect x="1225" y="887" width="130" height="36" rx="18" fill="#fff" stroke="#16a34a"/>
    <text x="1290" y="910" text-anchor="middle" class="token">&lt;eos&gt;</text>
  </g>

  <g aria-label="Unbounded serial latent data path">
    <path d="M215 362 L215 627" class="red-halo"/>
    <path d="M215 362 L215 627" class="serial"/>
    <polygon points="-7,-14 7,-14 0,0" transform="translate(215 634)" class="serial-head"/>
    <path d="M215 637 L310 637 L341 362 L420 362" class="red-halo"/>
    <path d="M215 637 L310 637 L341 362 L420 362" class="serial"/>
    <polygon points="-14,-7 -14,7 0,0" transform="translate(427 362)" class="serial-head"/>

    <path d="M430 362 L430 627" class="red-halo"/>
    <path d="M430 362 L430 627" class="serial"/>
    <polygon points="-7,-14 7,-14 0,0" transform="translate(430 634)" class="serial-head"/>
    <path d="M430 637 L525 637 L556 362 L635 362" class="red-halo"/>
    <path d="M430 637 L525 637 L556 362 L635 362" class="serial"/>
    <polygon points="-14,-7 -14,7 0,0" transform="translate(642 362)" class="serial-head"/>

    <path d="M645 362 L645 627" class="red-halo"/>
    <path d="M645 362 L645 627" class="serial"/>
    <polygon points="-7,-14 7,-14 0,0" transform="translate(645 634)" class="serial-head"/>
    <path d="M645 637 L740 637 L771 362 L850 362" class="red-halo"/>
    <path d="M645 637 L740 637 L771 362 L850 362" class="serial"/>
    <polygon points="-14,-7 -14,7 0,0" transform="translate(857 362)" class="serial-head"/>

    <path d="M860 362 L860 627" class="red-halo"/>
    <path d="M860 362 L860 627" class="serial"/>
    <polygon points="-7,-14 7,-14 0,0" transform="translate(860 634)" class="serial-head"/>
    <path d="M860 637 L955 637 L986 362 L1065 362" class="red-halo"/>
    <path d="M860 637 L955 637 L986 362 L1065 362" class="serial"/>
    <polygon points="-14,-7 -14,7 0,0" transform="translate(1072 362)" class="serial-head"/>

    <path d="M1075 362 L1075 627" class="red-halo"/>
    <path d="M1075 362 L1075 627" class="serial"/>
    <polygon points="-7,-14 7,-14 0,0" transform="translate(1075 634)" class="serial-head"/>
    <path d="M1075 637 L1170 637 L1201 362 L1280 362" class="red-halo"/>
    <path d="M1075 637 L1170 637 L1201 362 L1280 362" class="serial"/>
    <polygon points="-14,-7 -14,7 0,0" transform="translate(1287 362)" class="serial-head"/>

    <path d="M1290 362 L1290 627" class="red-halo"/>
    <path d="M1290 362 L1290 627" class="serial"/>
    <polygon points="-7,-14 7,-14 0,0" transform="translate(1290 634)" class="serial-head"/>
  </g>

  <g transform="translate(78 955)">
    <rect x="0" y="0" width="1265" height="62" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <line x1="22" y1="20" x2="82" y2="20" class="flow"/>
    <text x="96" y="24" class="small">normal within-token data flow</text>

    <line x1="320" y1="20" x2="380" y2="20" class="attention"/>
    <text x="394" y="24" class="small">cached K/V flows from the previous token into the current block</text>

    <line x1="880" y1="20" x2="930" y2="20" class="serial"/>
    <polygon points="-14,-7 -14,7 0,0" transform="translate(940 20)" class="serial-head"/>
    <text x="954" y="24" class="small">opaque serial path</text>

    <text x="22" y="48" class="small">For current R1-R5, K/V flows from prior R6-R10 (R6-&gt;R1, ..., R10-&gt;R5). The red R3-to-R8 path can repeat for every generated token.</text>
  </g>
</svg>
